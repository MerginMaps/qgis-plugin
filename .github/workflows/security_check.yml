name: QGIS Plugin Repository Checks

on: [push]

jobs:
  qgis_repo_checks:
    name: Mirror plugins.qgis.org upload scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install scan tools
        run: pip install bandit==1.9.4 detect-secrets==1.5.0 flake8==7.3.0

      - name: Run checks
        run: python scripts/qgis_plugin_repo_checks.py Mergin
